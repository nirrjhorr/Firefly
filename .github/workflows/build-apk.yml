name: Build and Publish Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Rename and Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/firefly-v1.0.0-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk release-artifacts/firefly-v1.0.0-debug.apk
          cd release-artifacts
          sha256sum firefly-v1.0.0-release.apk > checksums-sha256.txt
          sha256sum firefly-v1.0.0-debug.apk >> checksums-sha256.txt
          ls -lh

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: firefly-android-apks
          path: release-artifacts/

      - name: Upload APKs to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Firefly v1.0.0 — Official Production Release"
          files: |
            release-artifacts/firefly-v1.0.0-release.apk
            release-artifacts/firefly-v1.0.0-debug.apk
            release-artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
