name: Build and Publish Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Platform
        run: |
          rm -rf android
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --project-name=firefly --org=app
          cp pubspec.yaml.bak pubspec.yaml
          rm pubspec.yaml.bak

      - name: Install Dependencies and Configure Android Platform
        run: |
          flutter pub get
          python3 scripts/configure_android.py
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Rename and Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/firefly-v1.0.0-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk release-artifacts/firefly-v1.0.0-debug.apk
          cd release-artifacts
          sha256sum firefly-v1.0.0-release.apk > checksums-sha256.txt
          sha256sum firefly-v1.0.0-debug.apk >> checksums-sha256.txt
          ls -lh

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: firefly-android-apks
          path: release-artifacts/

      - name: Upload APKs to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 release-artifacts/firefly-v1.0.0-release.apk release-artifacts/firefly-v1.0.0-debug.apk release-artifacts/checksums-sha256.txt --clobber
