name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - docs-readme-and-governance
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Platform
        run: |
          rm -rf android
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --project-name=firefly --org=app
          cp pubspec.yaml.bak pubspec.yaml
          rm pubspec.yaml.bak

      - name: Install Dependencies and Configure Android Platform
        run: |
          flutter pub get
          python3 scripts/configure_android.py
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Rename and Prepare Release Artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          TAG="v${VERSION}"
          echo "Building artifacts for version ${VERSION} (${TAG})..."
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/firefly-${TAG}-release.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "release-artifacts/firefly-${TAG}-debug.apk"
          cd release-artifacts
          sha256sum "firefly-${TAG}-release.apk" > checksums-sha256.txt
          sha256sum "firefly-${TAG}-debug.apk" >> checksums-sha256.txt
          ls -lh

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: firefly-android-apks
          path: release-artifacts/

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          TAG="v${VERSION}"
          RELEASE_TITLE="Firefly ${TAG} — Official Production Release"
          NOTES_FILE="dist/RELEASE_NOTES.md"

          echo "Publishing GitHub Release for ${TAG}..."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists, uploading/refreshing assets..."
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            echo "Creating new release ${TAG}..."
            if [ -f "${NOTES_FILE}" ]; then
              gh release create "${TAG}" release-artifacts/* --title "${RELEASE_TITLE}" --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG}" release-artifacts/* --title "${RELEASE_TITLE}" --notes "Firefly ${TAG} Production Release"
            fi
          fi
          echo "GitHub Release ${TAG} published."

